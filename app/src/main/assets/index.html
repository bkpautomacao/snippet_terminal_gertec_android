<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração de Servidor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #444;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #aaa;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-restart {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 15px;
        }

        .btn-restart:hover {
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            animation: fadeIn 0.3s ease;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
            display: block;
        }

        .icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">⚙️</div>
    <h1>Configuração de Servidor</h1>
    <p class="subtitle">Configure o endereço IP e porta do equipamento</p>

    <form id="configForm">
        <div class="form-group">
            <label for="ip">Endereço IP</label>
            <input
                    type="text"
                    id="ip"
                    name="ip"
                    placeholder="Ex: 192.168.1.100"
                    required
                    pattern="^(\d{1,3}\.){3}\d{1,3}$"
                    title="Digite um endereço IP válido"
            >
        </div>

        <div class="form-group">
            <label for="port">Porta</label>
            <input
                    type="number"
                    id="port"
                    name="port"
                    placeholder="Ex: 8080"
                    required
                    min="1"
                    max="65535"
                    title="Digite uma porta entre 1 e 65535"
            >
        </div>

        <button type="submit" class="btn" id="submitBtn">
            Aplicar Configuração
        </button>
    </form>

    <button class="btn btn-restart" id="restartBtn">
        🔄 Reiniciar Aplicação
    </button>

    <div id="message" class="message"></div>
</div>

<script>
    const form = document.getElementById('configForm');
    const submitBtn = document.getElementById('submitBtn');
    const restartBtn = document.getElementById('restartBtn');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const ip = document.getElementById('ip').value;
        const port = document.getElementById('port').value;

        // Validação adicional de IP
        const ipParts = ip.split('.');
        if (ipParts.length !== 4 || ipParts.some(part => parseInt(part) > 255 || parseInt(part) < 0)) {
            showMessage('Por favor, digite um endereço IP válido', 'error');
            return;
        }

        // Desabilita o botão e mostra loading
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="loading"></span>';
        messageDiv.className = 'message';
        messageDiv.style.display = 'none';

        try {
            const response = await fetch('/config/server', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    ip: ip,
                    port: parseInt(port)
                })
            });

            if (response.ok) {
                const data = await response.json();
                showMessage('✓ Configuração aplicada com sucesso!', 'success');
                console.log('Resposta do servidor:', data);
                document.getElementById('ip').value = ""
                document.getElementById('port').value = ""
            } else {
                throw new Error(`Erro: ${response.status} - ${response.statusText}`);
            }
        } catch (error) {
            showMessage('✗ Erro ao aplicar configuração: ' + error.message, 'error');
            console.error('Erro:', error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Aplicar Configuração';
        }
    });

    restartBtn.addEventListener('click', async () => {
        if (!confirm('Tem certeza que deseja reiniciar a aplicação?')) {
            return;
        }

        // Desabilita os botões e mostra loading
        restartBtn.disabled = true;
        submitBtn.disabled = true;
        restartBtn.innerHTML = '<span class="loading"></span>';
        messageDiv.className = 'message';
        messageDiv.style.display = 'none';

        try {
            const response = await fetch('/restart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            });

            if (response.ok) {
                const data = await response.json();
                showMessage('✓ Aplicação reiniciando...', 'success');
                console.log('Resposta do servidor:', data);
            } else {
                throw new Error(`Erro: ${response.status} - ${response.statusText}`);
            }
        } catch (error) {
            showMessage('✗ Erro ao reiniciar: ' + error.message, 'error');
            console.error('Erro:', error);
        } finally {
            restartBtn.disabled = false;
            submitBtn.disabled = false;
            restartBtn.innerHTML = '🔄 Reiniciar Aplicação';
        }
    });

    function showMessage(text, type) {
        messageDiv.textContent = text;
        messageDiv.className = `message ${type}`;
        messageDiv.style.display = 'block';
    }
</script>
</body>
</html>
